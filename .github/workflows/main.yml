name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q voidreaver-mod-1.21.11.zip
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: cd voidreaver-mod && gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: voidreaver-jar
          path: voidreaver-mod/build/libs/voidreaver-1.0.0.jar
